<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Sales</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        @media print {
            nav, footer, .no-print {
                display: none;
            }
        }
    </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a href="{% url 'home' %}" class="navbar-brand fw-bold">Hardware Sales</a>

        <div>
            <a href="{% url 'category_list' %}" class="btn btn-outline-light btn-sm">Categories</a>
            <a href="{% url 'product_list' %}" class="btn btn-outline-light btn-sm">Products</a>
            <a href="{% url 'stock_receipt_list' %}" class="btn btn-outline-light btn-sm">Stock</a>
            <a href="{% url 'home' %}" class="btn btn-outline-light btn-sm">Sales</a>

        </div>
    </div>
</nav>

<main class="container py-4">
    {% block content %}
    {% endblock %}
</main>

<footer class="text-center py-3 border-top mt-5">
    <p class="mb-0">Hardware Sales System &copy; 2026</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
